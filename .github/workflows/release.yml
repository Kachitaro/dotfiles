name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dot.exe
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: dot
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: dot
            archive_ext: tar.gz
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: dot
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: dot
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ARCHIVE_NAME="dot-${{ matrix.target }}.tar.gz"
          cd cli/target/${{ matrix.target }}/release
          tar -czf "../../../../${ARCHIVE_NAME}" dot
        shell: bash

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $archiveName = "dot-${{ matrix.target }}.zip"
          Compress-Archive -Path "cli\target\${{ matrix.target }}\release\dot.exe" -DestinationPath $archiveName
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dot-${{ matrix.target }}
          path: dot-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find release_artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
